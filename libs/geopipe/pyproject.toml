[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopipe"
version = "0.1.0"
description = "Shared contracts and helpers for the geo-pipeline workers"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["boto3>=1.35", "numpy>=2", "pillow>=10", "pydantic>=2.7", "redis>=5"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
bench = ["matplotlib>=3.8", "pycocotools>=2.0.8"]

[project.scripts]
geopipe = "geopipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
