name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: make check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the published base image (compiling GDAL on every PR is slow)
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geo-gdal:py3.12
          if docker pull -q "$IMG"; then docker tag "$IMG" geo-gdal:py3.12; else echo "not published, make up will build it"; fi
      - run: make e2e
      - run: make e2e-slim
      - run: make licences
      - if: failure()
        run: docker compose logs --no-color
