name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: make check

  base-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PY=${{ matrix.python }} -t geo-gdal:py${{ matrix.python }} base/
      - run: docker run --rm geo-gdal:py${{ matrix.python }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make e2e
      - run: make licences
      - if: failure()
        run: docker compose logs --no-color
