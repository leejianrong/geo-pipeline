name: publish-base
on:
  push:
    branches: [main]
    paths: ["base/**", ".github/workflows/publish-base.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify before publishing
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geo-gdal
          docker build --build-arg PY=${{ matrix.python }} -t $IMG:py${{ matrix.python }} base/
          out=$(docker run --rm $IMG:py${{ matrix.python }})
          echo "$out"
          gdal=$(echo "$out" | sed -n 's/.*gdal \([0-9.]*\).*/\1/p')
          numpy=$(echo "$out" | sed -n 's/.*numpy \([0-9.]*\).*/\1/p')
          docker tag $IMG:py${{ matrix.python }} $IMG:py${{ matrix.python }}-gdal$gdal-numpy$numpy
          docker push --all-tags $IMG
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: Verify the published image at runtime
        run: |
          docker image rm -f $IMG:py${{ matrix.python }}
          docker pull $IMG:py${{ matrix.python }}
          docker run --rm $IMG:py${{ matrix.python }}
