name: publish-base
# Publishes every GDAL x Python image in base/matrix.json to GHCR when base/ changes on main.
on:
  push:
    branches: [main]
    paths: ["base/**", ".github/workflows/publish-base.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      gdal: ${{ steps.m.outputs.gdal }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "gdal=$(jq -c '.gdal | keys' base/matrix.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gdal: ${{ fromJson(needs.matrix.outputs.gdal) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # build.sh verifies each image; publish.sh pushes, pulls it back and verifies again.
      - run: |
          REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geo-gdal
          for py in $(jq -r '.python[]' base/matrix.json); do
            base/build.sh ${{ matrix.gdal }} "$py"
            base/publish.sh ${{ matrix.gdal }} "$py" "$REPO"
          done
